spring:
  datasource:
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    # Show SQL statements emitted by Hibernate.
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    # Log SQL statements and parameter bindings.
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    # Log SQL result extraction.
    org.hibernate.orm.jdbc.extract: TRACE
    # Log second-level cache activity and internal operations.
    org.hibernate.cache: DEBUG
    org.hibernate.cache.spi: TRACE
    # Log Hibernate transaction activity.
    org.hibernate.resource.transaction: DEBUG

server:
  port: 8080
